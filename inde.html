<!DOCTYPE html><html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kasir Modern FIX</title>
<style>
body { font-family: Arial; margin:0; display:flex; height:100vh; }
.menu { width:60%; padding:20px; overflow:auto; }
.cart { width:40%; background:#f5f5f5; padding:20px; display:flex; flex-direction:column; }
.item { border:1px solid #ddd; padding:10px; margin:5px; border-radius:8px; }
.cart-item { display:flex; justify-content:space-between; margin:5px 0; }
.total { margin-top:auto; font-size:20px; font-weight:bold; }
button { padding:5px 10px; margin-left:5px; }
</style>
</head>
<body><div class="menu">
<h2>Menu</h2>
<input type="text" id="search" placeholder="Cari barang..." onkeyup="renderMenu()">
<div id="menuList"></div><h3>Tambah / Update Barang</h3>
<input type="text" id="nama" placeholder="Nama">
<input type="number" id="harga" placeholder="Harga">
<button onclick="tambahBarang()">Simpan</button>
</div><div class="cart">
<h2>Keranjang</h2>
<div id="cartList"></div>
<div class="total" id="total">Total: Rp0</div>
<input type="number" id="bayar" placeholder="Uang bayar">
<div id="kembalian"></div>
<button onclick="hitungKembalian()">Hitung</button>
<button onclick="printStruk()">Print</button>
</div><script>
let barang = JSON.parse(localStorage.getItem("barang")) || [];
let cart = [];

function simpan(){ localStorage.setItem("barang", JSON.stringify(barang)); }

function tambahBarang(){
  const nama = document.getElementById("nama").value.trim();
  const harga = document.getElementById("harga").value;

  if(!nama || !harga) return alert("Isi semua");

  const existing = barang.find(b=>b.nama.toLowerCase()===nama.toLowerCase());

  if(existing){
    existing.harga = Number(harga);
  } else {
    barang.push({nama, harga:Number(harga)});
  }

  simpan();
  renderMenu();

  document.getElementById("nama").value="";
  document.getElementById("harga").value="";
}

function renderMenu(){
  const keyword = document.getElementById("search").value.toLowerCase();
  const list = document.getElementById("menuList");
  list.innerHTML="";

  barang.filter(b=>b.nama.toLowerCase().includes(keyword))
  .forEach((b,index)=>{
    const div=document.createElement("div");
    div.className="item";

    div.innerHTML = `
      <b>${b.nama}</b> - Rp${b.harga.toLocaleString()} 
      <br>
      <button onclick="tambahKeCart(${index})">Tambah</button>
      <button onclick="editHarga(${index})">Edit</button>
    `;

    list.appendChild(div);
  });
}

function tambahKeCart(index){
  const b = barang[index];
  const item = cart.find(i=>i.nama===b.nama);

  if(item){ item.qty++; }
  else{ cart.push({...b, qty:1}); }

  renderCart();
}

function renderCart(){
  const list=document.getElementById("cartList");
  list.innerHTML="";
  let total=0;

  cart.forEach((c,i)=>{
    const sub=c.harga*c.qty;
    total+=sub;

    const div=document.createElement("div");
    div.className="cart-item";
    div.innerHTML=`${c.nama} x${c.qty} <span>Rp${sub.toLocaleString()}</span>`;

    list.appendChild(div);
  });

  document.getElementById("total").innerText="Total: Rp"+total.toLocaleString();
}

function editHarga(index){
  const hargaBaru = prompt("Masukkan harga baru:", barang[index].harga);

  if(hargaBaru !== null && hargaBaru !== ""){
    barang[index].harga = Number(hargaBaru);
    simpan();
    renderMenu();
  }
}

function hitungKembalian(){
  const bayar = Number(document.getElementById("bayar").value);
  const total = cart.reduce((a,b)=>a+(b.harga*b.qty),0);

  if(!bayar) return;

  const kembali = bayar-total;

  document.getElementById("kembalian").innerText = kembali>=0
    ? "Kembalian: Rp"+kembali.toLocaleString()
    : "Uang tidak cukup";
}

function printStruk(){
  let text="=== STRUK ===\n";
  let total=0;

  cart.forEach(c=>{
    let sub=c.harga*c.qty;
    total+=sub;
    text+=`${c.nama} x${c.qty} Rp${sub.toLocaleString()}\n`;
  });

  text+="----------------\n";
  text+="Total: Rp"+total.toLocaleString();

  const w=window.open();
  w.document.write("<pre>"+text+"</pre>");w.print(); }

renderMenu(); </script>

</body>
</html>
